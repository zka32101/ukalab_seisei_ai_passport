name: ukalab_seisei_ai_passport
description: "うかラボ 生成AIパスポート。生成AIパスポート試験（GUGA）の学習アプリ。追加モジュール: 生成AI導入実務者検定（GAIP）。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=1.17.0"

# 依存の向き: 本リポジトリ（薄いアプリ） → yourwish_kentei（試験エンジン） → app_common_kit（共通部品）。
# タグ固定（ref: vX.Y.Z）。main は参照しない（タグは不変）。
dependencies:
  flutter:
    sdk: flutter
  app_common_kit:
    git:
      url: https://github.com/zka32101/app_common_kit.git
      ref: v3.0.0
  ukalab_core:
    git:
      url: https://github.com/zka32101/ukalab_core.git
      ref: v0.53.0

  # 状態管理
  flutter_riverpod: ">=2.5.1 <3.0.0"

  # 間隔反復（記録タブ）の端末内保存
  shared_preferences: ">=2.2.0 <3.0.0"

  # 今月のAI動向: 一次情報のリンクを開く
  url_launcher: ">=6.2.0 <7.0.0"

  # ながら学習モードの読み上げ（端末標準の音声合成）

  # うかラボ同士の相互紹介（Remote Config 配信）。タグ固定。
  # firebase_* は cross_promo_kit の許容レンジ（>=4.0.0 <7.0.0）内で、既存の firebase_core 4.15 と解決できる版。
  firebase_core: ^4.15.0
  firebase_remote_config: ^6.7.0
  cross_promo_kit:
    git:
      url: https://github.com/zka32101/cross_promo_kit
      ref: v0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - content/exam/
    - content/news/
