name: Build release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - name: リリース署名鍵を復元
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.UPLOAD_STORE_PASSWORD }}
          keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}
          keyAlias=${{ secrets.UPLOAD_KEY_ALIAS }}
          storeFile=/tmp/upload-keystore.jks
          EOF
      - name: google-services.json を復元（Secret 設定時のみ）
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "google-services.json を生成しました"
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 が未設定のためスキップします"
          fi
      - run: flutter pub get
      - name: AABをビルド（広告ユニットID・RevenueCatキーはSecretsから注入）
        run: >
          flutter build appbundle --release
          --dart-define=RC_GOOGLE_KEY=${{ secrets.RC_GOOGLE_KEY }}
          --dart-define=AD_BANNER_ID=${{ secrets.AD_BANNER_ID }}
          --dart-define=AD_INTERSTITIAL_ID=${{ secrets.AD_INTERSTITIAL_ID }}
          --dart-define=AD_REWARDED_ID=${{ secrets.AD_REWARDED_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
