name: Validate exam content

on:
  push:
    paths:
      - 'content/exam/**'
      - 'content/news/**'
      - 'pubspec.yaml'
      - '.github/workflows/validate_content.yml'
  pull_request:
    paths:
      - 'content/exam/**'
      - 'content/news/**'
      - 'pubspec.yaml'
      - '.github/workflows/validate_content.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run ukalab_core:validate_content content/exam/seisei_ai_passport.json --terms content/exam/terms.jsonl --ai-news content/news/news.jsonl --boundary content/exam/boundary_scenarios.jsonl --reading content/exam/reading.jsonl --attention-viz content/exam/attention_viz_scenarios.jsonl --ethics-case content/exam/ethics_case_scenarios.jsonl --ml-lab content/exam/ml_lab_datasets.jsonl --nn-builder content/exam/nn_builder_datasets.jsonl --confusion-matrix content/exam/confusion_matrix_scenarios.jsonl --conv-lab content/exam/conv_lab_images.jsonl --method-choice content/exam/method_choice_scenarios.jsonl --story content/exam/story_scenarios.jsonl --predict content/exam/predict_run_scenarios.jsonl --misconception content/exam/teach_mascot_scenarios.jsonl --failure content/exam/failure_gallery_cases.jsonl content/exam/questions.jsonl
